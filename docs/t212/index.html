<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0d1117">
<title>T212</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#0d1117;--card:#161b22;--line:#21262d;--ink:#e6edf3;--mut:#8b949e;--g:#3fb950;--r:#f85149;--y:#d29922;--rad:16px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:contain}
.hide{display:none!important}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:rgba(13,17,23,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header img{width:28px;height:28px;border-radius:7px}
header h1{font:800 18px system-ui;margin:0;flex:1}
main{max-width:560px;margin:0 auto;padding:14px 14px 48px}
#ptr{height:0;overflow:hidden;text-align:center;color:var(--mut);font:600 13px system-ui;transition:height .2s}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:14px 16px;margin-top:12px}
.lbl{font:600 12px system-ui;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.big{font:800 clamp(44px,15vw,68px)/1.05 system-ui;letter-spacing:-1px;font-variant-numeric:tabular-nums;margin:4px 0 2px}
.sub{font-size:14px;color:var(--mut)}
.pos{color:var(--g)}.neg{color:var(--r)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.grid3 .card{margin:0;padding:12px}
.v{font:700 19px system-ui;font-variant-numeric:tabular-nums;margin-top:4px}
.bar{height:12px;background:#0b0f14;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;border-radius:999px;transition:width .4s}
.row{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.pname{font:700 17px system-ui}
.ptk{font-size:12px;color:var(--mut)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 10px;margin-top:10px;font-size:13px}
.kv b{display:block;font:600 15px system-ui;font-variant-numeric:tabular-nums;color:var(--ink)}
.kv span{color:var(--mut)}
.pnl{font:800 20px system-ui;font-variant-numeric:tabular-nums;text-align:right}
.pnl small{display:block;font:600 13px system-ui}
h2{font:800 16px system-ui;margin:22px 2px 0}
svg{width:100%;height:170px;display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:#238636;color:#fff;font:700 15px system-ui;padding:11px 18px;border-radius:999px;border:0;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid #30363d}
.btn.sm{padding:7px 12px;font-size:13px}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.6}
.foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:22px}
.status{text-align:center;font-size:13px;color:var(--mut);margin-top:14px}
.warn{color:var(--y)}
#lock{max-width:380px;margin:12vh auto 0;padding:0 18px;text-align:center}
#lock img{width:84px;height:84px;border-radius:20px}
#lock h2{font-size:22px;margin:16px 0 6px}
#lock input[type=password]{width:100%;font:500 17px system-ui;padding:13px 14px;border-radius:12px;border:1px solid #30363d;background:var(--card);color:var(--ink);margin:14px 0 10px}
#lock label{display:flex;gap:8px;align-items:center;justify-content:center;color:var(--mut);font-size:14px;margin-bottom:16px}
#lock .btn{width:100%}
#err{color:var(--r);min-height:20px;margin-top:12px;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:7px 0;border-bottom:1px solid var(--line)}
td:last-child{text-align:right;font-weight:700}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin-top:8px}
.grid2 .card{margin:0;padding:12px}
.badge{display:inline-block;font:700 11px system-ui;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:2px;border:1px solid}
.badge.lt{color:#58a6ff;border-color:#1f6feb;background:rgba(31,111,235,.12)}
.badge.fa{color:var(--y);border-color:#9e6a03;background:rgba(210,153,34,.12)}
.badge.pn{color:#d2a8ff;border-color:#8957e5;background:rgba(137,87,229,.14)}
.badge.ot{color:var(--mut);border-color:#30363d;background:rgba(139,148,158,.10)}
.ordwrap{overflow-x:auto;padding:12px}
table.ord{font-size:12.5px;table-layout:fixed;min-width:320px}
table.ord th:nth-child(1){width:27%}table.ord th:nth-child(2){width:22%}table.ord th:nth-child(3){width:17%}table.ord th:nth-child(4){width:15%}table.ord th:nth-child(5){width:19%}
table.ord th{font-size:10px;letter-spacing:0}
table.ord td:first-child{overflow-wrap:anywhere}
table.ord th{text-align:left;font:600 11px system-ui;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;padding:0 6px 6px 0;border-bottom:1px solid var(--line)}
table.ord td{padding:8px 5px 8px 0;vertical-align:top;font-variant-numeric:tabular-nums}
table.ord td:last-child,table.ord th:last-child{text-align:right;padding-right:0;font-weight:400}
table.ord .badge{margin-left:0;font-size:10px;padding:1px 5px;text-transform:none;letter-spacing:0}
.nw{white-space:nowrap}
</style>
</head>
<body>
<section id="lock">
  <img src="icon-192.png" alt="">
  <h2>T212 pozicijos</h2>
  <div class="sub">Įveskite slaptažodį duomenims atrakinti.</div>
  <form id="lf" autocomplete="off">
    <input id="pw" type="password" placeholder="Slaptažodis" autocomplete="current-password" required>
    <label><input id="rem" type="checkbox" checked> Prisiminti šiame įrenginyje</label>
    <button class="btn" id="ub" type="submit">Atrakinti</button>
  </form>
  <div id="err"></div>
</section>

<div id="app" class="hide">
<header><img src="icon-192.png" alt=""><h1>T212 pozicijos</h1><button class="btn ghost sm" id="rb">↻ Atnaujinti</button></header>
<main>
  <div id="ptr">Atleiskite, kad atnaujintumėte…</div>
  <div class="card">
    <div class="lbl">Bendras P&amp;L</div>
    <div class="big" id="total">–</div>
    <div class="sub" id="totalsub"></div>
  </div>
  <div class="grid3">
    <div class="card"><div class="lbl">Vertė</div><div class="v" id="value">–</div></div>
    <div class="card"><div class="lbl">Investuota</div><div class="v" id="invested">–</div></div>
    <div class="card"><div class="lbl">Grynieji</div><div class="v" id="cash">–</div></div>
  </div>
  <div class="card">
    <div class="row"><div class="lbl">Iki stop ribos</div><div class="sub" id="stoplbl"></div></div>
    <div class="bar"><i id="stopbar"></i></div>
    <div class="sub" id="stopsub"></div>
  </div>
  <h2>Strategijos</h2>
  <div class="grid2" id="groups"></div>
  <h2>Pozicijos</h2>
  <div id="positions"></div>
  <div id="orderswrap" class="hide"><h2>Laukiantys pavedimai</h2><div class="card ordwrap"><table class="ord"><thead><tr><th>Akcija</th><th>Tipas</th><th>Kaina</th><th>Kiekis</th><th>Strategija</th></tr></thead><tbody id="orders"></tbody></table></div></div>
  <h2>P&amp;L istorija</h2>
  <div class="card"><svg id="chart" viewBox="0 0 340 170" preserveAspectRatio="none"></svg><div class="sub" id="chartsub"></div></div>
  <div id="closedwrap" class="hide"><h2>Uždaryti sandoriai</h2><div class="card"><table id="closed"></table></div></div>
  <div class="status" id="status"></div>
  <div class="foot">
    <button class="btn ghost sm" id="nb">🔔 Įspėjimas &lt; −80 €</button>
    <button class="btn ghost sm" id="lb">🔒 Užrakinti</button>
  </div>
</main>
</div>

<script>
/*CRYPTO-START*/
// AES-GCM-256 with PBKDF2-SHA256 key (format written by publish_app.py). Pure WebCrypto.
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const _keys = new Map();
async function deriveKey(pass, saltB64, iter) {
  const id = saltB64 + ':' + iter;
  if (_keys.has(id) && _keys.get(id).pass === pass) return _keys.get(id).key;
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(saltB64), iterations: iter },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  _keys.clear(); _keys.set(id, { pass, key });
  return key;
}
async function decryptBlob(blob, pass) {
  if (!blob || blob.v !== 1 || blob.kdf !== 'PBKDF2-SHA256' || !(blob.iter >= 250000)) throw new Error('format');
  const key = await deriveKey(pass, blob.salt, blob.iter);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(blob.iv) }, key, b64(blob.ct)); // throws on wrong pass
  return JSON.parse(new TextDecoder().decode(pt));
}
/*CRYPTO-END*/

const $ = (id) => document.getElementById(id);
const LS = 't212.pass';
let pass = null, data = null, timer = null, busy = false;
const eur = (v, sign) => v == null ? '–' : (sign && v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toLocaleString('lt-LT', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
const num = (v, d = 2) => v == null ? '–' : v.toLocaleString('lt-LT', { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = (v) => v == null ? '–' : (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toLocaleString('lt-LT', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' %';
const cls = (v) => v > 0 ? 'pos' : v < 0 ? 'neg' : '';
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// Berlin wall-clock "YYYY-MM-DD HH:MM" for now, to compare with data.updated (already Berlin time).
function berlinNow() {
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Berlin', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(new Date()).map((x) => [x.type, x.value]));
  return `${p.year}-${p.month}-${p.day} ${p.hour}:${p.minute}`;
}
const asMin = (s) => { const m = /^(\d{4})-(\d\d)-(\d\d)[ T](\d\d):(\d\d)/.exec(s || ''); return m ? Date.UTC(+m[1], m[2] - 1, +m[3], +m[4], +m[5]) / 6e4 : NaN; };

async function fetchBlob() {
  const r = await fetch('data.enc.json?t=' + Date.now(), { cache: 'no-store' });
  if (r.status === 404) { const e = new Error('nodata'); e.code = 404; throw e; }
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

async function load(manual) {
  if (busy) return; busy = true; $('rb').disabled = true;
  if (manual) $('status').textContent = 'Atnaujinama…';
  try {
    const blob = await fetchBlob();
    data = await decryptBlob(blob, pass);
    render(); checkAlert();
  } catch (e) {
    if (e.code === 404) $('status').innerHTML = '<span class="warn">Duomenys dar nepaskelbti. Bandykite vėliau.</span>';
    else if (e.name === 'OperationError') { lock('Netinkamas slaptažodis (arba duomenys pasikeitė). Įveskite iš naujo.'); }
    else $('status').innerHTML = '<span class="warn">Nepavyko atnaujinti (' + esc(e.message) + '). Rodomi paskutiniai duomenys.</span>';
  } finally { busy = false; $('rb').disabled = false; }
}

// Strategy: missing -> 'ilgalaikis'; unknown strings are shown with their raw name (never folded into ilgalaikis).
const stratOf = (s) => (typeof s === 'string' && s.trim()) ? s.trim().toLowerCase() : 'ilgalaikis';
const STRATS = ['ilgalaikis', 'greitas', 'penny'];
const STRAT = { ilgalaikis: { label: 'Ilgalaikis', card: 'Ilgalaikiai', cls: 'lt' }, greitas: { label: 'Greitas', card: 'Greiti', cls: 'fa', empty: 'tikslas +5 %, stop −3 %' },
  penny: { label: 'Penny', card: 'Penny', cls: 'pn', empty: 'JAV small caps' } };
const stratLabel = (s, d) => STRAT[s]?.label || d?.groups?.[s]?.label || s;
const badge = (s, d) => `<span class="badge ${STRAT[s]?.cls || 'ot'}">${esc(stratLabel(s, d))}</span>`;
// Native-currency price formatting (positions/orders); all totals stay in EUR.
const SYM = { EUR: '€', USD: '$', GBP: '£', GBX: 'p' };
const ccyOf = (p) => String(p?.currency || 'EUR').toUpperCase();
const money = (v, c) => { if (v == null || !isFinite(v)) return '–'; const a = Math.abs(v), dp = a > 0 && a < 10 ? (Math.round(a * 100) === a * 100 ? 2 : Math.min(4, Math.max(2, String(a).split('.')[1]?.length || 2))) : 2;
  return (v < 0 ? '−' : '') + a.toLocaleString('lt-LT', { minimumFractionDigits: dp, maximumFractionDigits: dp }) + ' ' + (SYM[c] || c || '€'); };
const fxRate = (d, c) => c === 'EUR' ? 1 : (d.fx && d.fx[c] && typeof d.fx[c].rate === 'number' ? d.fx[c].rate : null);
// Uses data.groups when present; older data (no groups) is rebuilt from positions/closed.
function groupOf(d, s) {
  if (d.groups && d.groups[s]) return d.groups[s];
  const ps = (d.positions || []).filter((p) => stratOf(p.strategy) === s), cs = (d.closed || []).filter((c) => stratOf(c.strategy) === s);
  const invested = ps.reduce((a, p) => a + (p.cost || 0), 0), value = ps.reduce((a, p) => a + (p.value ?? p.cost ?? 0), 0), realized = cs.reduce((a, c) => a + (c.pnl || 0), 0);
  return { invested, value, unrealized: value - invested, realized, total: value - invested + realized, count: ps.length + cs.length };
}
function renderGroups(d) {
  const seen = [...(d.positions || []), ...(d.closed || [])].map((x) => stratOf(x.strategy));
  const extra = [...Object.keys(d.groups || {}).filter((s) => (d.groups[s] || {}).count > 0), ...seen].filter((s, i, a) => !STRATS.includes(s) && a.indexOf(s) === i);
  $('groups').innerHTML = [...STRATS, ...extra].map((s) => {
    const g = groupOf(d, s), m = STRAT[s] || {}, title = m.card || stratLabel(s, d);
    const bc = String(g.budgetCurrency || 'EUR').toUpperCase();
    const bud = typeof g.budget === 'number' ? ` · biudžetas ${num(g.budget, Number.isInteger(g.budget) ? 0 : 2)} ${SYM[bc] || bc}` : '';
    if (!g.count) return `<div class="card"><div class="lbl">${esc(title)}</div><div class="v sub">dar nėra</div><div class="sub">${esc((m.empty || '0 sandorių') + bud)}</div></div>`;
    return `<div class="card"><div class="lbl">${esc(title)}</div><div class="v ${cls(g.total)}">${eur(g.total, true)}</div><div class="sub">${g.count} sand. · įdėta ${eur(g.invested)}${esc(bud)}</div></div>`;
  }).join('');
}
function renderOrders(d) {
  const os = Array.isArray(d.orders) ? d.orders.filter((o) => o && o.ticker) : [];
  $('orderswrap').classList.toggle('hide', !os.length);
  $('orders').innerHTML = os.map((o) => {
    const c = ccyOf(o), buy = String(o.side || '').toUpperCase() !== 'SELL';
    const lim = typeof o.limit === 'number' ? o.limit : null, stp = typeof o.stop === 'number' ? o.stop : null;
    const m = (v, cc) => `<span class="nw">${money(v, cc)}</span>`;
    const price = lim != null && stp != null ? `${m(lim, c)}<div class="ptk">stop ${m(stp, c)}</div>` : lim != null ? m(lim, c) : stp != null ? `stop<br>${m(stp, c)}` : 'rinkos';
    const q = typeof o.qty === 'number' ? `<span class="nw">${num(o.qty, 4).replace(/0+$/, '').replace(/,$/, '')} vnt.</span>` : null;
    const v = typeof o.value === 'number' ? m(o.value, String(o.valueCurrency || c).toUpperCase()) : null;
    const qty = q && v ? `${q}<div class="ptk">${v}</div>` : q || v || '–';
    return `<tr><td><b>${esc(o.name || o.ticker)}</b><div class="ptk">${esc(o.ticker)}${o.created ? ' · ' + esc(o.created) : ''}</div></td>
      <td class="${buy ? 'pos' : 'neg'}">${buy ? 'Pirkimas' : 'Pardavimas'}</td><td>${price}</td><td>${qty}</td><td>${badge(stratOf(o.strategy), d)}</td></tr>`;
  }).join('');
}

function render() {
  const d = data, lim = d.stopLimit ?? -100;
  renderGroups(d); renderOrders(d);
  $('total').textContent = eur(d.total, true); $('total').className = 'big ' + cls(d.total);
  const tp = d.invested ? d.total / (d.budget || d.invested) * 100 : null;
  $('totalsub').innerHTML = `Nerealizuotas <b class="${cls(d.unrealized)}">${eur(d.unrealized, true)}</b> · Realizuotas <b class="${cls(d.realized)}">${eur(d.realized, true)}</b>` + (tp != null ? ` · ${pct(tp)} biudžeto` : '');
  $('value').textContent = eur(d.value); $('invested').textContent = eur(d.invested); $('cash').textContent = eur(d.cash);
  const used = Math.min(1, Math.max(0, d.total / lim)); const left = d.total - lim;
  $('stopbar').style.width = Math.max(2, used * 100) + '%';
  $('stopbar').style.background = used >= .8 ? 'var(--r)' : used >= .5 ? 'var(--y)' : 'var(--g)';
  $('stoplbl').textContent = `riba ${eur(lim)}`;
  $('stopsub').innerHTML = left > 0 ? `Liko <b>${eur(left)}</b> iki ${eur(lim)} ribos (išnaudota ${Math.round(used * 100)} %)` : `<b class="neg">Stop riba pasiekta!</b>`;
  $('positions').innerHTML = (d.positions || []).map((p) => {
    const c = ccyOf(p), rate = fxRate(d, c);
    const dist = p.stop && p.price ? (p.price - p.stop) / p.price * 100 : null;
    const riskN = p.stop && p.avg ? (p.stop - p.avg) * p.qty : null; // native currency
    const risk = riskN == null ? null : rate != null ? riskN * rate : null;
    const tgt = typeof p.target === 'number' && p.target > 0 ? p.target : null;
    const tdist = tgt && p.price ? (tgt - p.price) / p.price * 100 : null;
    return `<div class="card"><div class="row"><div><div class="pname">${esc(p.name)}${badge(stratOf(p.strategy), d)}</div><div class="ptk">${esc(p.ticker)}</div></div>
      <div class="pnl ${cls(p.pnl)}">${eur(p.pnl, true)}<small>${pct(p.pct)}</small></div></div>
      <div class="kv"><div><span>Kiekis</span><b>${num(p.qty, 4).replace(/0+$/, '').replace(/,$/, '')}</b></div>
      <div><span>Pirkta</span><b>${money(p.avg, c)}</b></div><div><span>Dabar</span><b>${money(p.price, c)}</b></div>
      <div><span>Vertė</span><b>${eur(p.value)}</b></div><div><span>Stop</span><b>${money(p.stop, c)}</b></div>
      <div><span>Iki stop</span><b class="${dist != null && dist < 3 ? 'neg' : ''}">${dist == null ? '–' : num(dist, 1) + ' %'}</b></div>
      ${tgt ? `<div><span>Tikslas</span><b>${money(tgt, c)}</b></div><div><span>Iki tikslo</span><b class="${tdist != null && tdist <= 0 ? 'pos' : ''}">${tdist == null ? '–' : tdist <= 0 ? 'pasiektas' : '+' + num(tdist, 1) + ' %'}</b></div>` : ''}</div>
      ${risk != null ? `<div class="sub" style="margin-top:6px">Suveikus stop: ${eur(risk, true)}${c !== 'EUR' ? ` (${money(riskN, c)})` : ''}</div>` : riskN != null ? `<div class="sub" style="margin-top:6px">Suveikus stop: ${money(riskN, c)}</div>` : ''}
      ${c !== 'EUR' ? `<div class="sub" style="margin-top:4px">Kainos ${esc(c)}, vertė ir P&amp;L eurais${rate != null ? ` (1 ${esc(c)} = ${num(rate, 4)} €)` : ''}</div>` : ''}</div>`;
  }).join('') || '<div class="card sub">Atvirų pozicijų nėra.</div>';
  chart(d.history || []);
  const cl = d.closed || [];
  $('closedwrap').classList.toggle('hide', !cl.length);
  $('closed').innerHTML = cl.map((c) => `<tr><td>${esc(c.name)}${badge(stratOf(c.strategy), d)}<div class="ptk">${esc(c.at)} · ${num(c.qty, 4)} vnt. · ${eur(c.proceeds)}</div></td><td class="${cls(c.pnl)}">${eur(c.pnl, true)}</td></tr>`).join('');
  const age = asMin(berlinNow()) - asMin(d.updated);
  $('status').innerHTML = `Atnaujinta: <b>${esc(d.updated)}</b> (Berlyno laiku)` + (age > 120 ? ` <span class="warn">· duomenys senesni nei ${Math.floor(age / 60)} val.</span>` : '');
}

function chart(h) {
  const svg = $('chart'), W = 340, H = 170, P = 8;
  const pts = h.filter((x) => typeof x.total === 'number');
  if (pts.length < 2) { svg.innerHTML = `<text x="${W / 2}" y="${H / 2}" fill="#8b949e" font-size="13" text-anchor="middle">Per mažai taškų grafikui</text>`; $('chartsub').textContent = ''; return; }
  const ys = pts.map((x) => x.total); let lo = Math.min(0, ...ys), hi = Math.max(0, ...ys); if (hi - lo < 2) { hi += 1; lo -= 1; }
  const X = (i) => P + (W - 2 * P) * i / (pts.length - 1), Y = (v) => P + (H - 2 * P) * (hi - v) / (hi - lo);
  const line = pts.map((x, i) => `${X(i).toFixed(1)},${Y(x.total).toFixed(1)}`).join(' ');
  const last = ys[ys.length - 1], col = last >= 0 ? '#3fb950' : '#f85149';
  svg.innerHTML = `<defs><linearGradient id="gf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".35"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    <line x1="0" x2="${W}" y1="${Y(0)}" y2="${Y(0)}" stroke="#30363d" stroke-dasharray="4 4"/>
    <polygon points="${X(0)},${Y(0)} ${line} ${X(pts.length - 1)},${Y(0)}" fill="url(#gf)"/>
    <polyline points="${line}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${X(pts.length - 1)}" cy="${Y(last)}" r="4" fill="${col}"/>`;
  $('chartsub').textContent = `${pts[0].t} → ${pts[pts.length - 1].t} · min ${eur(Math.min(...ys), true)} · max ${eur(Math.max(...ys), true)}`;
}

// Local notification while the app is open when total P&L < -80 €.
const ALERT = -80;
function checkAlert() {
  if (!data || localStorage.getItem('t212.alert') !== '1' || !('Notification' in window) || Notification.permission !== 'granted') return;
  const below = data.total < ALERT, was = sessionStorage.getItem('t212.below') === '1';
  sessionStorage.setItem('t212.below', below ? '1' : '0');
  if (below && !was) {
    const body = `Bendras P&L ${eur(data.total, true)} (riba ${eur(data.stopLimit ?? -100)})`;
    navigator.serviceWorker?.ready.then((r) => r.showNotification('T212: P&L žemiau −80 €', { body, icon: 'icon-192.png', tag: 't212-alert' }))
      .catch(() => new Notification('T212: P&L žemiau −80 €', { body }));
  }
}
function nbLabel() { if (!('Notification' in window)) return; $('nb').textContent = localStorage.getItem('t212.alert') === '1' && Notification.permission === 'granted' ? '🔔 Įspėjimas įjungtas' : '🔕 Įspėjimas < −80 €'; }
$('nb').onclick = async () => {
  if (!('Notification' in window)) return alert('Ši naršyklė nepalaiko pranešimų.');
  if (localStorage.getItem('t212.alert') === '1') localStorage.removeItem('t212.alert');
  else if ((await Notification.requestPermission()) === 'granted') { localStorage.setItem('t212.alert', '1'); sessionStorage.removeItem('t212.below'); checkAlert(); }
  nbLabel();
};

function lock(msg) {
  pass = null; data = null; localStorage.removeItem(LS); clearInterval(timer);
  $('app').classList.add('hide'); $('lock').classList.remove('hide'); $('err').textContent = msg || ''; $('pw').value = '';
}
async function unlock(p, remember) {
  $('ub').disabled = true; $('err').textContent = ''; $('ub').textContent = 'Tikrinama…';
  try {
    let blob = null;
    try { blob = await fetchBlob(); } catch (e) { if (e.code !== 404) throw e; }
    if (blob) data = await decryptBlob(blob, p);
    pass = p; if (remember) localStorage.setItem(LS, p); else localStorage.removeItem(LS);
    $('lock').classList.add('hide'); $('app').classList.remove('hide');
    if (data) { render(); checkAlert(); } else $('status').innerHTML = '<span class="warn">Duomenys dar nepaskelbti. Bandykite vėliau.</span>';
    clearInterval(timer); timer = setInterval(() => load(false), 5 * 60 * 1000);
  } catch (e) {
    $('err').textContent = e.name === 'OperationError' ? 'Neteisingas slaptažodis.' : 'Nepavyko įkelti duomenų: ' + e.message;
    localStorage.removeItem(LS);
  } finally { $('ub').disabled = false; $('ub').textContent = 'Atrakinti'; }
}
$('lf').onsubmit = (e) => { e.preventDefault(); unlock($('pw').value, $('rem').checked); };
$('rb').onclick = () => load(true);
$('lb').onclick = () => lock();
document.addEventListener('visibilitychange', () => { if (!document.hidden && pass) load(false); });

// Pull to refresh
let y0 = null, pulled = 0;
addEventListener('touchstart', (e) => { y0 = scrollY <= 0 && pass ? e.touches[0].clientY : null; }, { passive: true });
addEventListener('touchmove', (e) => { if (y0 == null) return; pulled = Math.max(0, e.touches[0].clientY - y0); $('ptr').style.height = Math.min(pulled / 2.5, 44) + 'px'; $('ptr').style.lineHeight = '44px'; }, { passive: true });
addEventListener('touchend', () => { if (y0 != null && pulled > 110) load(true); y0 = null; pulled = 0; $('ptr').style.height = '0'; });

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
nbLabel();
const saved = localStorage.getItem(LS);
if (saved) unlock(saved, true);
</script>
