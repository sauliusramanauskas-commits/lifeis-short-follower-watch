function hashStr(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function initials(n){var p=String(n||'?').trim().split(/\s+/);return((p[0]||'?')[0]+(p.length>1?p[p.length-1][0]:'')).toUpperCase();}
function initialsUri(n){var h=hashStr(n)%360,h2=(h+50)%360;
  var svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl('+h+',85%,62%)"/><stop offset="1" stop-color="hsl('+h2+',75%,45%)"/></linearGradient></defs><rect width="100" height="100" fill="url(#g)"/><text x="50" y="50" dy=".35em" text-anchor="middle" font-family="Arial,sans-serif" font-size="40" font-weight="800" fill="#fff">'+initials(n).replace(/[<&>]/g,'')+'</text></svg>';
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);}
function attachImg(img,src,name){
  img.alt=name; img.decoding='async'; img.loading='lazy'; img.draggable=false;
  var stage=0;
  img.onerror=function(){stage++; if(stage===1 && !/^(https?:|data:)/.test(src)) img.src=RAW_BASE+src; else {img.onerror=null; img.src=initialsUri(name);}};
  img.src=src;
}
function fmt(n){return Number(n).toLocaleString('en-US');}

// ---------- build scene ----------
var OWNER_R = 120;
function render(d){
  world.innerHTML='';
  var o=d.owner||{};
  var oa=document.createElement('a'); oa.id='owner'; oa.href=o.url||'https://www.facebook.com/people/Lifeis-Short/100013159621667/';
  oa.target='_blank'; oa.rel='noopener'; oa.setAttribute('aria-label','Open Kristina’s Facebook profile');
  oa.innerHTML='<div class="glow"></div><div class="ring"></div><img><div class="cap">'+(o.displayName||'Kristina · Lifeis Short')+'</div>';
  var oi=oa.querySelector('img'); attachImg(oi,o.img||'',o.name||'Lifeis Short'); oi.loading='eager'; oi.alt='Kristina · Lifeis Short';
  oa.dataset.name='Kristina · Lifeis Short'; oa.dataset.owner='1';
  world.appendChild(oa);

  var list=(d.followers||[]).slice();
  var n=list.length, frag=document.createDocumentFragment();
  // pack into concentric rings; spacing ~ 1.25 avatar
  var r=OWNER_R+150, idx=0, ring=0, maxR=r;
  var rand=rng(666);
  // shuffle deterministically so neighbours look varied
  for(var i=n-1;i>0;i--){var j=Math.floor(rand()*(i+1));var t=list[i];list[i]=list[j];list[j]=t;}
  while(idx<n){
    var cap=Math.max(6,Math.floor(2*Math.PI*r/74));
    var cnt=Math.min(cap,n-idx), off=rand()*360, dir=ring%2?'reverse':'normal';
    var dur=(2*Math.PI*r/(reduce?4:9)); // seconds, ~9px/s linear speed
    for(var k=0;k<cnt;k++,idx++){
      var f=list[idx], s=Math.round(46+rand()*20);
      var orb=document.createElement('div'); orb.className='orb';
      var rr=r+(rand()-.5)*18;
      orb.style.cssText='--r:'+rr.toFixed(1)+'px;--a0:'+(off+k*360/cnt+(rand()-.5)*(180/cnt)).toFixed(2)+'deg;--dur:'+dur.toFixed(1)+'s;--dir:'+dir;
      var a=document.createElement('a'); a.className='av'; a.href=f.url; a.target='_blank'; a.rel='noopener';
      a.dataset.name=f.name; a.setAttribute('aria-label',f.name);
      a.style.cssText='--s:'+s+'px;--bh:'+(3+rand()*6).toFixed(1)+'px;--bd:'+(2.2+rand()*2.6).toFixed(2)+'s;--bdl:-'+(rand()*5).toFixed(2)+'s';
      var im=document.createElement('img'); attachImg(im,f.img,f.name); a.appendChild(im);
      orb.appendChild(a); frag.appendChild(orb);
    }
    maxR=r; r+=70; ring++;
  }
  world.appendChild(frag);
  sceneR=maxR+50;
  document.getElementById('sub').innerHTML='<b>'+fmt(n)+'</b> follower faces orbiting <b>Kristina</b> · tap anyone to visit';
}

// ---------- zoom / pan ----------
var sceneR=400, view={x:0,y:0,s:1}, MIN=0.08, MAX=6;
function fitScale(){var w=innerWidth,h=innerHeight-150;return Math.max(MIN,Math.min(1.1,Math.min(w,h)/(2*sceneR)));}
function apply(){world.style.transform='translate('+view.x+'px,'+view.y+'px) scale('+view.s+')';}
function clampS(s){return Math.min(MAX,Math.max(MIN,s));}
function zoomAt(f,cx,cy){ // cx,cy relative to stage center
  var ns=clampS(view.s*f); f=ns/view.s;
  view.x=cx-(cx-view.x)*f; view.y=cy-(cy-view.y)*f; view.s=ns; apply();}
var anim=null;
function animateTo(t){ if(reduce){view=t;apply();return;}
  var from={x:view.x,y:view.y,s:view.s},t0=performance.now();cancelAnimationFrame(anim);
  (function step(now){var p=Math.min(1,(now-t0)/350),e=1-Math.pow(1-p,3);
    view.x=from.x+(t.x-from.x)*e;view.y=from.y+(t.y-from.y)*e;view.s=from.s+(t.s-from.s)*e;apply();if(p<1)anim=requestAnimationFrame(step);})(t0);}
function reset(){animateTo({x:0,y:0,s:fitScale()});}
function btnZoom(f){var ns=clampS(view.s*f),k=ns/view.s;animateTo({x:view.x*k,y:view.y*k,s:ns});}
document.getElementById('zin').onclick=function(){btnZoom(1.6);};
document.getElementById('zout').onclick=function(){btnZoom(1/1.6);};
document.getElementById('zreset').onclick=reset;
function rel(e){return{x:e.clientX-innerWidth/2,y:e.clientY-innerHeight/2};}
stage.addEventListener('wheel',function(e){e.preventDefault();cancelAnimationFrame(anim);
  var dy=e.deltaMode===1?e.deltaY*16:e.deltaY; var p=rel(e); zoomAt(Math.exp(-dy*0.0015),p.x,p.y); hideTip();},{passive:false});

var ptrs=new Map(), moved=false, downAt=0, downTarget=null, startDist=0, startS=1, lastMid=null, captured=false;
function mid(){var a=[...ptrs.values()];if(a.length<2)return a[0];return{x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};}
function dist(){var a=[...ptrs.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);}
stage.addEventListener('pointerdown',function(e){
  if(e.button&&e.button!==0)return; cancelAnimationFrame(anim);
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,x0:e.clientX,y0:e.clientY});
  if(ptrs.size===1){moved=false;downAt=Date.now();downTarget=e.target.closest('.av,#owner');lastMid={x:e.clientX,y:e.clientY};}
  else if(ptrs.size===2){moved=true;startDist=dist();startS=view.s;lastMid=mid();startCapture();}
});
function startCapture(){if(captured)return;captured=true;stage.classList.add('dragging');ptrs.forEach(function(_,id){try{stage.setPointerCapture(id);}catch(_){}});hideTip();hidePop();}
stage.addEventListener('pointermove',function(e){
  var p=ptrs.get(e.pointerId); if(!p){ if(e.pointerType==='mouse')hover(e); return; }
  p.x=e.clientX;p.y=e.clientY;
  if(!moved && Math.hypot(p.x-p.x0,p.y-p.y0)>8){moved=true;startCapture();}
  if(!moved)return;
  var m=mid();
  if(ptrs.size>=2){var ns=clampS(startS*dist()/startDist),c={x:m.x-innerWidth/2,y:m.y-innerHeight/2};
    view.x+=m.x-lastMid.x;view.y+=m.y-lastMid.y; var f=ns/view.s; view.x=c.x-(c.x-view.x)*f;view.y=c.y-(c.y-view.y)*f;view.s=ns;}
  else{view.x+=m.x-lastMid.x;view.y+=m.y-lastMid.y;}
  lastMid=m;apply();
});
function up(e){
  if(!ptrs.has(e.pointerId))return; ptrs.delete(e.pointerId);
  if(ptrs.size===1){lastMid=mid();startDist=0;}
  if(ptrs.size===0){captured=false;stage.classList.remove('dragging');
    if(!moved && e.type==='pointerup' && e.pointerType!=='mouse' && Date.now()-downAt<700){ tapTouch(downTarget,e); }
    else if(!moved && e.pointerType!=='mouse' && !downTarget) hidePop();
    lastDragEnd=moved?Date.now():0;}
}
var lastDragEnd=0;
stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
// Cancel link navigation after drags; on touch, first tap shows popup instead.
stage.addEventListener('click',function(e){
  var a=e.target.closest('.av,#owner');
  if(Date.now()-lastDragEnd<350){e.preventDefault();return;}
  if(a && touchLike && !a.dataset.owner){e.preventDefault();}
  if(!a)hidePop();
},true);
var touchLike=false;
stage.addEventListener('pointerdown',function(e){touchLike=e.pointerType!=='mouse';},true);
var selEl=null;
function tapTouch(a,e){
  if(!a){hidePop();return;}
  if(a.dataset.owner)return; // owner: let the click open the profile directly
  if(selEl){selEl.classList.remove('sel');selEl.parentNode.classList.remove('selo');} selEl=a; a.classList.add('sel'); a.parentNode.classList.add('selo');
  var r=a.getBoundingClientRect();
  pop.querySelector('.n').textContent=a.dataset.name; var l=pop.querySelector('a'); l.href=a.href;
  pop.style.left=Math.min(innerWidth-90,Math.max(90,r.left+r.width/2))+'px'; pop.style.top=Math.max(110,r.top)+'px'; pop.classList.add('on');
}
function hidePop(){pop.classList.remove('on');if(selEl){selEl.classList.remove('sel');selEl.parentNode.classList.remove('selo');selEl=null;}}
// desktop hover tooltip
var tipEl=null;
function hover(e){var a=e.target.closest('.av,#owner');
  if(a===tipEl){if(a)placeTip(a);return;} tipEl=a; if(!a){hideTip();return;}
  tip.textContent=a.dataset.name; tip.classList.add('on'); placeTip(a);}
function placeTip(a){var r=a.getBoundingClientRect();tip.style.left=(r.left+r.width/2)+'px';tip.style.top=(r.top-8)+'px';}
function hideTip(){tip.classList.remove('on');tipEl=null;}
stage.addEventListener('pointerleave',hideTip);
addEventListener('resize',function(){if(!ptrs.size)reset();});

// ---------- background stars ----------
(function(){var c=document.getElementById('stars'),x=c.getContext('2d'),dpr=Math.min(2,devicePixelRatio||1);
  function draw(){c.width=innerWidth*dpr;c.height=innerHeight*dpr;var r=rng(42);x.clearRect(0,0,c.width,c.height);
    for(var i=0;i<160;i++){x.globalAlpha=.2+r()*.6;x.fillStyle=r()<.2?'#ffb3c6':(r()<.3?'#c9b8ff':'#fff');x.beginPath();x.arc(r()*c.width,r()*c.height,(r()*1.3+.3)*dpr,0,7);x.fill();}}
  draw();addEventListener('resize',draw);})();

// ---------- confetti ----------
function confetti(){
  var c=document.getElementById('confetti'),x=c.getContext('2d'),dpr=Math.min(2,devicePixelRatio||1);
  c.width=innerWidth*dpr;c.height=innerHeight*dpr;
  var cols=['#ff3d6e','#7c4dff','#ffd166','#22d3a6','#ffffff','#4cc9f0'],P=[],N=reduce?40:180;
  for(var i=0;i<N;i++)P.push({x:c.width/2+(Math.random()-.5)*c.width*.3,y:c.height*.45,vx:(Math.random()-.5)*22*dpr,vy:(-Math.random()*20-6)*dpr,
    w:(6+Math.random()*6)*dpr,h:(3+Math.random()*4)*dpr,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%cols.length],star:Math.random()<.2});
  var t0=performance.now();
  (function f(now){var t=now-t0;x.clearRect(0,0,c.width,c.height);
    P.forEach(function(p){p.vy+=.45*dpr;p.vx*=.985;p.vy*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
      x.save();x.globalAlpha=Math.max(0,1-t/4500);x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;
      if(p.star){x.beginPath();for(var k=0;k<10;k++){var rr=k%2?p.w*.35:p.w*.8,a=k*Math.PI/5;x.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);}x.fill();}
      else x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore();});
    if(t<4500)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height);})(t0);
}

// ---------- live count ----------
function liveCount(){
  fetch('../status.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(s){
    if(s&&s.current){var h=document.querySelector('h1');
      document.getElementById('sub').innerHTML='Now <b>'+fmt(s.current)+'</b> followers and counting · '+fmt(DATA.followers.length)+' faces orbiting <b>Kristina</b>';}
  }).catch(function(){});
}

// ---------- boot ----------
function boot(d){DATA=d;render(d);view.s=fitScale()*.6;apply();animateTo({x:0,y:0,s:fitScale()});
  setTimeout(confetti,250);liveCount();setTimeout(function(){document.getElementById('hint').style.opacity=0;},7000);
  window.__celebrate={count:d.followers.length,view:view};}
if(DATA)boot(DATA);
else fetch('followers.json').then(function(r){return r.json();}).then(boot).catch(function(){boot({owner:{},followers:[]});});
})();
</script>
</body>
</html>
